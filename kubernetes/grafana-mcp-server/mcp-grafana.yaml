apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-grafana
  namespace: observability
  labels:
    app: mcp-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-grafana
  template:
    metadata:
      labels:
        app: mcp-grafana
    spec:
      containers:
        - name: mcp-grafana
          image: mcp/grafana:latest
          args: ["-t", "sse", "-address", ":8000"]
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: GRAFANA_URL
              valueFrom:
                secretKeyRef:
                  name: mcp-grafana-credentials
                  key: GRAFANA_URL
            - name: GRAFANA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mcp-grafana-credentials
                  key: GRAFANA_API_KEY
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15